<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>捷運乘法</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#5e35b1">
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#24324a;--dim:#6a7f9a;--acc:#5e35b1;--bd:#c9d8ea;--ok:#2e7d32;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--card:#1c2535;--ink:#e6edf7;--dim:#9fb0c8;--bd:#33425c}}
:root[data-theme="dark"]{--bg:#121826;--card:#1c2535;--ink:#e6edf7;--dim:#9fb0c8;--bd:#33425c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;padding:14px}
#app{width:100%;max-width:480px}
h1{text-align:center;font-size:1.4rem;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.8rem;color:var(--dim);margin:8px 0 4px}
input{width:100%;padding:10px;font-size:1.2rem;text-align:center;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink)}
button.main{width:100%;padding:14px;margin-top:12px;font-size:1.1rem;font-weight:700;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
.hidden{display:none}
.rules{font-size:.85rem;line-height:1.8;color:var(--dim);text-align:center}
.ctrl{display:flex;gap:10px;margin-top:12px}
.ctrl button{flex:1;padding:12px;font-size:1rem;font-weight:700;border:0;border-radius:10px;color:#fff;cursor:pointer}
.hud{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;margin-bottom:8px}
.scene{position:relative;aspect-ratio:1.6/1;border-radius:14px;overflow:hidden;background:linear-gradient(#90caf9,#e3f2fd);border:2px solid var(--bd);margin-bottom:12px}
.track{position:absolute;left:0;right:0;bottom:0;height:36%;background:url(track.webp) repeat-x left bottom;background-size:auto 100%;z-index:1}
.st{position:absolute;top:6px;width:26%;transform:translateX(-50%);text-align:center;font-weight:900;font-size:.75rem;line-height:1.3;color:#24324a;z-index:2}
.st small{display:block;font-size:.8rem;min-height:1.2em;font-weight:400;line-height:1.2}
.st img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:6px;border:2px solid #fff;box-shadow:0 1px 4px #0003;margin-bottom:2px}
.train{position:absolute;bottom:30%;width:26%;transform:translateX(-50%);transition:left .4s ease;text-align:center;line-height:1;z-index:4}
.train img{display:block;width:100%}
.train span{display:block;white-space:nowrap;font-size:1.05rem;font-weight:900;color:#24324a;text-shadow:0 0 4px #fff,0 0 4px #fff;margin-bottom:2px}
/* 獎勵：雲與車 */
.cloud{position:absolute;z-index:0;line-height:1;opacity:.92;pointer-events:none;animation:drift linear infinite}
@keyframes drift{from{left:-14%}to{left:108%}}
.car{position:absolute;bottom:.5%;z-index:3;width:9%;pointer-events:none;animation:drive linear infinite}
.car img{display:block;width:100%}
@keyframes drive{from{left:108%}to{left:-12%}}
.q{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.target{font-size:2.6rem;white-space:nowrap;font-weight:900;color:var(--acc);line-height:1}
.msg{font-size:.85rem;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.nb{aspect-ratio:2/1;border-radius:12px;border:3px solid transparent;font-size:2rem;font-weight:900;color:#fff;cursor:pointer}
.nb.bad{border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.res{text-align:center;line-height:1.8}
.res b{font-size:2rem;color:var(--acc)}
.reward{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px dashed var(--bd);font-size:.9rem}
.reward.got{border-color:var(--ok);color:var(--ok);font-weight:700}
.collect{text-align:center;font-weight:700;font-size:1rem;line-height:1.7}
.collect small{display:block;font-weight:400;font-size:.75rem;color:var(--dim)}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;padding:9px 4px;font-size:.8rem;font-weight:700;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
#update-bar{display:none;position:fixed;left:0;right:0;z-index:9999;bottom:env(safe-area-inset-bottom,0px);background:#0a3a1a;border-top:2px solid #00e676;padding:12px 20px;align-items:center;justify-content:space-between;gap:12px;font-size:.9rem;color:#fff}
#update-bar button{padding:8px 20px;background:#00e676;color:#0a2a14;border:none;border-radius:4px;font-weight:900;cursor:pointer}
#version-tag{text-align:right;font-size:.65rem;color:var(--dim);opacity:.6;min-height:1em}
</style></head><body><div id="update-bar"><span>發現新版本</span><button id="update-btn">立即更新</button></div>
<div id="app">
<div id="version-tag"></div>
<h1>🚇 捷運乘法</h1>

<div id="menu">
  <div class="card">
    <div class="rules">連續答對 10 題，從中山國中開到忠孝復興。<br>完成時間越短，獎勵越好：<br>
      ≤15 秒　☁️＋🚗<br>15~20 秒　☁️<br>20~25 秒　🚗<br>25~35 秒　+1 點（集滿 5 點多一輛🚗）</div>
    <button class="main" onclick="start()">發車</button>
  </div>
  <div class="card">
    <div class="collect" id="collect-menu"></div>
    <div class="tools">
      <button onclick="exportJSON()">匯出紀錄 JSON</button>
      <button onclick="$('importFile').click()">匯入紀錄</button>
      <button onclick="clearRecords()">清除紀錄</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importJSON(this)">
  </div>
</div>

<div id="game" class="hidden">
  <div class="hud"><span id="seglab">中山國中 → 南京復興</span><span id="timer">0.0 秒</span><span id="prog">0 / 5</span></div>
  <div class="scene" id="scene">
    <div class="st" style="left:15%"><img src="st-zhongshan.webp" alt="中山國中站">中山國中站<small id="p0"></small></div>
    <div class="st" style="left:50%"><img src="st-nanjing.webp" alt="南京復興站">南京復興站<small id="p1"></small></div>
    <div class="st" style="left:85%"><img src="st-zhongxiao.webp" alt="忠孝復興站">忠孝復興站<small id="p2"></small></div>
    <div class="track"></div>
    <div class="train" id="train" style="left:15%"><span id="onboard"></span><img src="train.webp" alt="捷運車廂"></div>
  </div>
  <div class="q"><div class="target" id="target">0</div><div class="msg" id="msg"></div></div>
  <div class="grid" id="grid"></div>
  <div class="ctrl">
    <button style="background:var(--acc)" onclick="start()">重來</button>
    <button style="background:var(--dim)" onclick="resetToMenu()">回主選單</button>
  </div>
</div>

<div id="result" class="card res hidden"></div>
</div>
<script>
const COLORS=["#FF8A65","#FFB74D","#7CB342","#29B6F6","#AB47BC","#EC407A","#26A69A","#FBC02D","#78909C"];
let S,timerId;
const $=id=>document.getElementById(id);
const people=n=>n>0?'🧍'.repeat(n):'';

/* ===== 遊戲紀錄（JSON）=====
   格式：{ "version":1, "records":[ {t, b, onboard, score}（舊紀錄可能多帶 a、perfect，會被忽略）, ... ] }
   - 自動存在瀏覽器 localStorage（JSON 字串）
   - 可用「匯出紀錄 JSON」下載成檔案、「匯入紀錄」合併回來
   雲、車的數量由 records 即時計算，不另存，匯入後自然一致。 */
const KEY='mrtmulti-records-v1';
let DB=loadDB();
function loadDB(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.records))return d;}catch(e){}
  return {version:1,records:[]};
}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}

/* 獎勵規則（依完成時間 t＝發車到抵達忠孝復興站的總秒數，紀錄中的 b）
   t ≤ 15        → ☁️ +1、🚗 +1
   15 < t ≤ 20   → ☁️ +1
   20 < t ≤ 25   → 🚗 +1
   25 < t ≤ 35   → 點數 +1；累積 5 點 → 🚗 +1
   只要這一局拿到車（不論原因），點數歸零。 */
const PTS_FULL=5;
function tally(){
  let clouds=0,cars=0,pts=0;
  for(const r of DB.records){
    const t=r.b; if(typeof t!=='number')continue;
    if(t<=15){clouds++;cars++;pts=0;}
    else if(t<=20){clouds++;}
    else if(t<=25){cars++;pts=0;}
    else if(t<=35){pts++;if(pts>=PTS_FULL){cars++;pts=0;}}
  }
  return {clouds,cars,pts};
}

function collectText(){
  const t=tally();
  return `☁️ × ${t.clouds}　🚗 × ${t.cars}　📒 已記錄 ${DB.records.length} 局
    <small>25~35 秒累積點數：${t.pts} / ${PTS_FULL}（集滿多一輛車）</small>`;
}

const CAR_IMGS=['car1.webp','car2.webp'];   // 之後有新車圖，加進這個陣列即可
function renderCollection(){
  const t=tally();
  $('collect-menu').innerHTML=collectText();
  const sc=$('scene');
  sc.querySelectorAll('.cloud,.car').forEach(e=>e.remove());
  const nc=Math.min(t.clouds,14), nv=Math.min(t.cars,10);
  for(let i=0;i<nc;i++){
    const e=document.createElement('div');e.className='cloud';e.textContent='☁️';
    e.style.top=(2+((i*37)%42))+'%';
    e.style.fontSize=(1.3+((i*13)%10)/10)+'rem';
    const dur=40+((i*17)%30);
    e.style.animationDuration=dur+'s';
    e.style.animationDelay=(-dur*((i*0.173)%1))+'s';
    sc.appendChild(e);
  }
  for(let i=0;i<nv;i++){
    const e=document.createElement('div');e.className='car';
    e.innerHTML='<img src="'+CAR_IMGS[i%CAR_IMGS.length]+'" alt="車">';
    e.style.width=(8+((i*7)%4))+'%';
    const dur=9+((i*5)%8);
    e.style.bottom=(0.5+(i%2)*2.2)+'%';
    e.style.animationDuration=dur+'s';
    e.style.animationDelay=(-dur*((i*0.211)%1))+'s';
    sc.appendChild(e);
  }
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='mrtmulti-records.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.records))throw 0;
      const have=new Set(DB.records.map(r=>r.t));
      let add=0;
      d.records.forEach(r=>{
        if(r&&typeof r.t==='string'&&typeof r.a==='number'&&!have.has(r.t)){DB.records.push(r);have.add(r.t);add++;}
      });
      DB.records.sort((x,y)=>x.t<y.t?-1:1);
      saveDB();renderCollection();
      alert(`匯入完成，新增 ${add} 筆紀錄`);
    }catch(e){alert('檔案格式不正確');}
    inp.value='';
  };
  rd.readAsText(f);
}
function clearRecords(){
  if(!confirm('確定要清除所有紀錄（雲與車也會一併歸零）？建議先匯出備份。'))return;
  DB={version:1,records:[]};saveDB();renderCollection();
}

const PAX_SEC=5;   // 南京復興站候車乘客：每過幾秒走一人
function start(){
  S={seg:0,step:0,onboard:5,waiting:5,t0:performance.now(),segStart:performance.now(),target:0,answer:0,done:false};
  $('menu').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');
  $('p0').textContent='';renderCollection();render();newRound();
  clearInterval(timerId);timerId=setInterval(tick,100);
}

function resetToMenu(){
  clearInterval(timerId);
  if(S)S.done=true;
  $('game').classList.add('hidden');$('result').classList.add('hidden');$('menu').classList.remove('hidden');
  renderCollection();
}

function tick(){
  if(S.done)return;
  const now=performance.now();
  const segT=(now-S.segStart)/1000;
  if(S.seg===0) S.waiting=5-Math.min(5,Math.floor(segT/PAX_SEC));   // 每滿 PAX_SEC 秒，南京復興站走一人
  $('timer').textContent=`${((now-S.t0)/1000).toFixed(1)} 秒`;
  render();
}

function render(){
  $('p1').textContent=S.seg===0?people(S.waiting):'';
  $('onboard').textContent=S.onboard+'人';
  $('seglab').textContent=S.seg===0?'中山國中 → 南京復興':'南京復興 → 忠孝復興';
  $('prog').textContent=S.step+' / 5';
  const p=(S.seg*5+S.step)/10;
  $('train').style.left=(15+p*70)+'%';
}

const rnd=n=>Math.floor(Math.random()*n);
function newRound(){
  const x=2+rnd(8), y=2+rnd(8);            // 個位數 2~9
  S.answer=x*y;
  const near=new Set();
  [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].forEach(([p,q])=>{ if(p>=1&&p<=10&&q>=1&&q<=10) near.add(p*q); });
  near.delete(S.answer);
  const opts=[...near].sort(()=>Math.random()-.5).slice(0,3);
  while(opts.length<3){ const v=(1+rnd(9))*(1+rnd(9)); if(v!==S.answer&&!opts.includes(v)) opts.push(v); }
  const nums=opts.concat(S.answer).sort(()=>Math.random()-.5);
  $('target').textContent=`${x} × ${y} = ?`;
  $('msg').textContent='選出正確的答案';
  $('grid').innerHTML='';
  nums.forEach(n=>{
    const b=document.createElement('button');
    b.className='nb';b.textContent=n;b.style.background=COLORS[n%COLORS.length];
    b.onclick=()=>pick(b,n);
    $('grid').appendChild(b);
  });
}

function pick(btn,n){
  if(S.done)return;
  if(n!==S.answer){btn.classList.add('bad');$('msg').textContent='不對喔，再試一次！';return;}
  S.step++;
  if(S.step<5){render();newRound();return;}
  // 到站
  if(S.seg===0){
    S.onboard+=S.waiting;S.waiting=0;S.seg=1;S.step=0;S.segStart=performance.now();
    render();$('msg').textContent='到南京復興站了！';newRound();
  }else{
    finish();
  }
}

function finish(){
  S.done=true;clearInterval(timerId);render();
  const b=+((performance.now()-S.t0)/1000).toFixed(2);   // 完成時間 t
  const score=10*S.onboard;

  const before=tally();
  DB.records.push({t:new Date().toISOString(),b,onboard:S.onboard,score});
  saveDB();
  const after=tally();

  const dc=after.clouds>before.clouds, dv=after.cars>before.cars;
  let rwd,got=dc||dv;
  if(dc&&dv)rwd='☁️🚗 畫面多了一朵雲和一輛車！';
  else if(dc)rwd='☁️ 畫面多了一朵雲！';
  else if(dv&&b>25)rwd=`🚗 集滿 ${PTS_FULL} 點，畫面多了一輛車！`;
  else if(dv)rwd='🚗 畫面多了一輛車！';
  else if(b<=35)rwd=`+1 點，累積 ${after.pts} / ${PTS_FULL}，再 ${PTS_FULL-after.pts} 點就多一輛車`;
  else rwd='35 秒內完成才有獎勵喔';

  $('game').classList.add('hidden');
  const r=$('result');r.classList.remove('hidden');
  r.innerHTML=`<div>🎉 抵達忠孝復興站！</div>
    <div>完成時間 t = ${b.toFixed(1)} 秒</div>
    <div>車上旅客 n = ${S.onboard} 人</div>
    <b>${score} 分</b>
    <div class="reward${got?' got':''}">${rwd}</div>
    <div class="collect" style="margin-top:8px">${collectText()}</div>
    <button class="main" onclick="start()">再玩一次</button>
    <button class="main" style="background:var(--dim)" onclick="resetToMenu()">回主選單</button>`;
}

renderCollection();

/* ===== PWA 安裝 / 更新（使用者確認後才切換版本） ===== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.active && reg.active.postMessage('GET_VERSION');
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', ()=>{
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            $('update-bar').style.display = 'flex';
          }
        });
      });
      $('update-btn').onclick = ()=>{
        reg.waiting && reg.waiting.postMessage('SKIP_WAITING');
        $('update-bar').style.display = 'none';
      };
      setInterval(()=>reg.update(), 60000);
      document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update(); });
    });
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    navigator.serviceWorker.addEventListener('message', (e)=>{
      if(e.data && e.data.type === 'VERSION') $('version-tag').textContent = 'v' + e.data.version;
    });
  });
}
</script></body></html>
