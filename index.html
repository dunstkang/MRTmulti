<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>捷運乘法</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#5e35b1">
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#24324a;--dim:#6a7f9a;--acc:#5e35b1;--bd:#c9d8ea;--ok:#2e7d32;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--card:#1c2535;--ink:#e6edf7;--dim:#9fb0c8;--bd:#33425c}}
:root[data-theme="dark"]{--bg:#121826;--card:#1c2535;--ink:#e6edf7;--dim:#9fb0c8;--bd:#33425c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;padding:14px}
#app{width:100%;max-width:480px}
h1{text-align:center;font-size:1.4rem;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.8rem;color:var(--dim);margin:8px 0 4px}
input{width:100%;padding:10px;font-size:1.2rem;text-align:center;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink)}
button.main{width:100%;padding:14px;margin-top:12px;font-size:1.1rem;font-weight:700;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
.hidden{display:none}
.ctrl{display:flex;gap:10px;margin-top:12px}
.ctrl button{flex:1;padding:12px;font-size:1rem;font-weight:700;border:0;border-radius:10px;color:#fff;cursor:pointer}
.hud{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;margin-bottom:8px}
.scene{position:relative;height:150px;border-radius:14px;overflow:hidden;background:linear-gradient(#90caf9,#e3f2fd);border:2px solid var(--bd);margin-bottom:12px}
.rail{position:absolute;left:0;right:0;top:92px;height:5px;background:#d32f2f}
.st{position:absolute;top:46px;transform:translateX(-50%);text-align:center;font-weight:900;font-size:1.1rem;color:#24324a}
.st small{display:block;font-size:.9rem;min-height:1.2em;font-weight:400}
.st .plat{width:46px;height:40px;border:3px solid #d32f2f;border-radius:8px;background:#ffffffaa;margin:2px auto 0}
.train{position:absolute;top:60px;transform:translateX(-50%);transition:left .4s ease;font-size:1.8rem;text-align:center;line-height:1}
.train span{display:block;white-space:nowrap;font-size:.7rem;font-weight:700;color:#24324a;background:#fff;border-radius:8px;padding:1px 6px}
.q{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.target{font-size:2.6rem;white-space:nowrap;font-weight:900;color:var(--acc);line-height:1}
.msg{font-size:.85rem;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.nb{aspect-ratio:2/1;border-radius:12px;border:3px solid transparent;font-size:2rem;font-weight:900;color:#fff;cursor:pointer}
.nb.bad{border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.over{color:var(--bad)}
.res{text-align:center;line-height:1.8}
.res b{font-size:2rem;color:var(--acc)}
#update-bar{display:none;position:fixed;left:0;right:0;z-index:9999;bottom:env(safe-area-inset-bottom,0px);background:#0a3a1a;border-top:2px solid #00e676;padding:12px 20px;align-items:center;justify-content:space-between;gap:12px;font-size:.9rem;color:#fff}
#update-bar button{padding:8px 20px;background:#00e676;color:#0a2a14;border:none;border-radius:4px;font-weight:900;cursor:pointer}
#version-tag{text-align:right;font-size:.65rem;color:var(--dim);opacity:.6;min-height:1em}
</style></head><body><div id="update-bar"><span>發現新版本</span><button id="update-btn">立即更新</button></div>
<div id="app">
<div id="version-tag"></div>
<h1>🚇 捷運乘法</h1>

<div id="menu" class="card">
  <label>每站之間的時間（秒）</label><input id="limit" type="number" min="5" max="300" value="15">
  <button class="main" onclick="start()">發車</button>
</div>

<div id="game" class="hidden">
  <div class="hud"><span id="seglab">A → B</span><span id="timer">0.0 秒</span><span id="prog">0 / 5</span></div>
  <div class="scene">
    <div class="st" style="left:10%">A<div class="plat"></div><small id="pA"></small></div>
    <div class="st" style="left:50%">B<div class="plat"></div><small id="pB"></small></div>
    <div class="st" style="left:90%">C<div class="plat"></div><small></small></div>
    <div class="rail"></div>
    <div class="train" id="train" style="left:10%">🚇<span id="onboard"></span></div>
  </div>
  <div class="q"><div class="target" id="target">0</div><div class="msg" id="msg"></div></div>
  <div class="grid" id="grid"></div>
  <div class="ctrl">
    <button style="background:var(--acc)" onclick="start()">重來</button>
    <button style="background:var(--dim)" onclick="resetToMenu()">重新設定</button>
  </div>
</div>

<div id="result" class="card res hidden"></div>
</div>
<script>
const COLORS=["#FF8A65","#FFB74D","#7CB342","#29B6F6","#AB47BC","#EC407A","#26A69A","#FBC02D","#78909C"];
let S,timerId;
const $=id=>document.getElementById(id);
const people=n=>n>0?'🧍'.repeat(n):'';

function start(){
    const a=Math.max(5,parseInt($('limit').value)||30);
  S={a,seg:0,step:0,onboard:5,waiting:5,t0:performance.now(),segStart:performance.now(),target:0,answer:0,done:false};
  $('menu').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');
  $('pA').textContent='';render();newRound();
  clearInterval(timerId);timerId=setInterval(tick,100);
}

function resetToMenu(){
  clearInterval(timerId);
  if(S)S.done=true;
  $('game').classList.add('hidden');$('result').classList.add('hidden');$('menu').classList.remove('hidden');
}

function tick(){
  if(S.done)return;
  const segT=(performance.now()-S.segStart)/1000;
  if(S.seg===0) S.waiting=5-Math.min(5,Math.floor(segT/S.a));   // 每滿一個 a 秒，B 站走一人
  const left=S.a-segT;
  $('timer').textContent=left>=0?`剩 ${left.toFixed(1)} 秒`:`超時 ${(-left).toFixed(1)} 秒`;
  $('timer').classList.toggle('over',left<0);
  render();
}

function render(){
  $('pB').textContent=S.seg===0?people(S.waiting):'';
  $('onboard').textContent=people(S.onboard)+' '+S.onboard+' 人';
  $('seglab').textContent=S.seg===0?'A → B':'B → C';
  $('prog').textContent=S.step+' / 5';
  const p=(S.seg*5+S.step)/10;
  $('train').style.left=(10+p*80)+'%';
}

const rnd=n=>Math.floor(Math.random()*n);
function newRound(){
  const x=2+rnd(8), y=2+rnd(8);            // 個位數 2~9
  S.answer=x*y;
  const near=new Set();
  [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].forEach(([p,q])=>{ if(p>=1&&p<=10&&q>=1&&q<=10) near.add(p*q); });
  near.delete(S.answer);
  const opts=[...near].sort(()=>Math.random()-.5).slice(0,3);
  while(opts.length<3){ const v=(1+rnd(9))*(1+rnd(9)); if(v!==S.answer&&!opts.includes(v)) opts.push(v); }
  const nums=opts.concat(S.answer).sort(()=>Math.random()-.5);
  $('target').textContent=`${x} × ${y} = ?`;
  $('msg').textContent='選出正確的答案';
  $('grid').innerHTML='';
  nums.forEach(n=>{
    const b=document.createElement('button');
    b.className='nb';b.textContent=n;b.style.background=COLORS[n%COLORS.length];
    b.onclick=()=>pick(b,n);
    $('grid').appendChild(b);
  });
}

function pick(btn,n){
  if(S.done)return;
  if(n!==S.answer){btn.classList.add('bad');$('msg').textContent='不對喔，再試一次！';return;}
  S.step++;
  if(S.step<5){render();newRound();return;}
  // 到站
  if(S.seg===0){
    S.onboard+=S.waiting;S.waiting=0;S.seg=1;S.step=0;S.segStart=performance.now();
    render();$('msg').textContent='到 B 站了！';newRound();
  }else{
    finish();
  }
}

function finish(){
  S.done=true;clearInterval(timerId);render();
  const b=(performance.now()-S.t0)/1000;
  const par=2*S.a, onTime=b<=par;
  const score=onTime?10*S.onboard:S.onboard*(par/b)*10;
  $('game').classList.add('hidden');
  const r=$('result');r.classList.remove('hidden');
  r.innerHTML=`<div>🎉 抵達 C 站！</div>
    <div>車上旅客 n = ${S.onboard} 人</div>
    <div>設定時間 a = ${S.a} 秒（兩段共 ${par} 秒），總花費 b = ${b.toFixed(1)} 秒</div>
    <div>${onTime?`準時抵達：得分 = 10 × ${S.onboard}`:`超時：得分 = ${S.onboard} × (${par}/${b.toFixed(1)}) × 10`}</div>
    <b>${score.toFixed(1)} 分</b>
    <button class="main" onclick="start()">再玩一次</button>
    <button class="main" style="background:var(--dim)" onclick="resetToMenu()">重新設定</button>`;
}

/* ===== PWA 安裝 / 更新（使用者確認後才切換版本） ===== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.active && reg.active.postMessage('GET_VERSION');
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', ()=>{
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            $('update-bar').style.display = 'flex';
          }
        });
      });
      $('update-btn').onclick = ()=>{
        reg.waiting && reg.waiting.postMessage('SKIP_WAITING');
        $('update-bar').style.display = 'none';
      };
      setInterval(()=>reg.update(), 60000);
      document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update(); });
    });
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    navigator.serviceWorker.addEventListener('message', (e)=>{
      if(e.data && e.data.type === 'VERSION') $('version-tag').textContent = 'v' + e.data.version;
    });
  });
}
</script></body></html>
